name: Deploy static site to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:config
      - run: npm run test:comments
      - run: npm run test:social
      - run: npm run check
      - name: Build
        env:
          NEKOMI_PAGES_URL: ${{ vars.SITE_URL }}
          NEKOMI_PAGES_BASE: ${{ vars.SITE_BASE }}
        run: |
          if [ -n "$NEKOMI_PAGES_URL" ]; then
            export SITE_URL="$NEKOMI_PAGES_URL"
          fi
          if [ -n "$NEKOMI_PAGES_BASE" ]; then
            export SITE_BASE="$NEKOMI_PAGES_BASE"
          fi
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
