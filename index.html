<!doctype html>
<html lang="zh-CN" class="mdui-theme-auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>小林的小窝 · 分享技术、日常</title>
  <meta name="description" content="小林的小窝，一个记录前端技术与日常的个人博客。当前为 P0 首页布局演示。">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">

  <!-- 在首屏绘制前恢复主题，避免明暗闪烁。 -->
  <script>
    (function () {
      try {
        var key = 'nekomi-theme';
        var mode = localStorage.getItem(key);
        if (mode !== 'light' && mode !== 'dark' && mode !== 'auto') {
          mode = 'auto';
        }
        var root = document.documentElement;
        root.classList.remove('mdui-theme-light', 'mdui-theme-dark', 'mdui-theme-auto');
        root.classList.add('mdui-theme-' + mode);
        root.dataset.theme = mode;
      } catch (error) {
        document.documentElement.classList.add('mdui-theme-auto');
      }
    }());
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Icons&family=Material+Icons+Outlined&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/mdui@2.1.5/mdui.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <script src="https://unpkg.com/mdui@2.1.5/mdui.global.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <!-- 移动端顶部工具栏：菜单、站点名、主题切换 -->
  <header class="mobile-bar" aria-label="移动端工具栏">
    <mdui-button-icon id="menu-button" aria-label="打开侧栏" aria-controls="mobile-drawer" aria-expanded="false">
      <mdui-icon name="menu" aria-hidden="true"></mdui-icon>
      <span class="visually-hidden">打开侧栏</span>
    </mdui-button-icon>
    <span class="mobile-brand" data-site-name>小林的小窝</span>
    <div class="theme-control">
      <mdui-dropdown placement="bottom-end">
        <mdui-button-icon slot="trigger" data-theme-icon aria-haspopup="menu" aria-expanded="false" aria-label="切换主题" title="切换主题">
          <mdui-icon name="contrast" data-theme-glyph aria-hidden="true"></mdui-icon>
          <span class="visually-hidden" data-theme-label>切换主题</span>
        </mdui-button-icon>
        <mdui-menu selects="single" value="auto" data-theme-menu role="menu" aria-label="主题模式">
          <mdui-menu-item value="light" role="menuitemradio" aria-checked="false">
            <mdui-icon slot="icon" name="light_mode" aria-hidden="true"></mdui-icon>
            <mdui-icon slot="selected-icon" name="check" aria-hidden="true"></mdui-icon>
            浅色
          </mdui-menu-item>
          <mdui-menu-item value="dark" role="menuitemradio" aria-checked="false">
            <mdui-icon slot="icon" name="dark_mode" aria-hidden="true"></mdui-icon>
            <mdui-icon slot="selected-icon" name="check" aria-hidden="true"></mdui-icon>
            深色
          </mdui-menu-item>
          <mdui-menu-item value="auto" role="menuitemradio" aria-checked="false">
            <mdui-icon slot="icon" name="contrast" aria-hidden="true"></mdui-icon>
            <mdui-icon slot="selected-icon" name="check" aria-hidden="true"></mdui-icon>
            跟随系统
          </mdui-menu-item>
        </mdui-menu>
      </mdui-dropdown>
    </div>
  </header>

  <div class="page-shell">
    <!-- 桌面端整体式侧栏：一个表面，内部用留白与分隔线组织 -->
    <aside class="sidebar" aria-label="站点信息与快捷入口">
      <div class="sidebar-inner" id="sidebar-desktop"></div>
    </aside>

    <main class="main" id="main-content" tabindex="-1">
      <h1 class="visually-hidden">小林的小窝 — 首页</h1>
      <div class="tabs-sentinel" id="tabs-sentinel" aria-hidden="true"></div>

      <div class="tabs-sticky" id="tabs-sticky">
        <div class="tabs-row">
          <div class="tabs-scroll">
            <mdui-tabs id="content-tabs" value="recent" role="tablist" aria-label="内容视图">
              <mdui-tab id="tab-recent" value="recent" role="tab" aria-controls="panel-recent" aria-selected="true" tabindex="0">最近发布</mdui-tab>
              <mdui-tab id="tab-categories" value="categories" role="tab" aria-controls="panel-categories" aria-selected="false" tabindex="-1">分类</mdui-tab>
              <mdui-tab id="tab-tags" value="tags" role="tab" aria-controls="panel-tags" aria-selected="false" tabindex="-1">标签</mdui-tab>
              <mdui-tab id="tab-archive" value="archive" role="tab" aria-controls="panel-archive" aria-selected="false" tabindex="-1">归档</mdui-tab>
            </mdui-tabs>
          </div>

          <span class="demo-badge" title="本页文章、日期、分类与标签均为演示数据">
            <mdui-icon name="science--outlined" aria-hidden="true"></mdui-icon>
            <span class="demo-badge__long">演示数据</span>
            <span class="demo-badge__short">演示</span>
          </span>

          <div class="theme-control theme-control--desktop">
            <mdui-dropdown placement="bottom-end">
              <mdui-button-icon slot="trigger" data-theme-icon aria-haspopup="menu" aria-expanded="false" aria-label="切换主题" title="切换主题">
                <mdui-icon name="contrast" data-theme-glyph aria-hidden="true"></mdui-icon>
                <span class="visually-hidden" data-theme-label>切换主题</span>
              </mdui-button-icon>
              <mdui-menu selects="single" value="auto" data-theme-menu role="menu" aria-label="主题模式">
                <mdui-menu-item value="light" role="menuitemradio" aria-checked="false">
                  <mdui-icon slot="icon" name="light_mode" aria-hidden="true"></mdui-icon>
                  <mdui-icon slot="selected-icon" name="check" aria-hidden="true"></mdui-icon>
                  浅色
                </mdui-menu-item>
                <mdui-menu-item value="dark" role="menuitemradio" aria-checked="false">
                  <mdui-icon slot="icon" name="dark_mode" aria-hidden="true"></mdui-icon>
                  <mdui-icon slot="selected-icon" name="check" aria-hidden="true"></mdui-icon>
                  深色
                </mdui-menu-item>
                <mdui-menu-item value="auto" role="menuitemradio" aria-checked="false">
                  <mdui-icon slot="icon" name="contrast" aria-hidden="true"></mdui-icon>
                  <mdui-icon slot="selected-icon" name="check" aria-hidden="true"></mdui-icon>
                  跟随系统
                </mdui-menu-item>
              </mdui-menu>
            </mdui-dropdown>
          </div>
        </div>
      </div>

      <noscript>
        <p class="noscript-note">本页使用原生 JavaScript 渲染演示数据，请启用 JavaScript 后查看。</p>
      </noscript>

      <div class="panel-stack" id="panel-stack">
        <section class="view-panel" id="panel-recent" data-tab="recent" role="tabpanel" aria-labelledby="tab-recent" tabindex="0">
          <div class="view-meta" id="recent-view-meta">
            <span id="recent-meta">正在载入演示文章…</span>
          </div>
          <div class="post-list" id="post-list"></div>

          <!-- 搜索是「最近发布」列表的一种筛选状态，不额外制造一个并列的 Tab。 -->
          <div class="search-view" id="search-view" aria-labelledby="search-title" hidden>
            <div class="search-head">
              <div class="search-head__text">
                <h2 class="search-title" id="search-title" tabindex="-1">搜索结果</h2>
                <p class="search-summary" id="search-summary" role="status" aria-live="polite"></p>
              </div>
              <mdui-button variant="text" icon="close" data-action="clear-search">清除搜索</mdui-button>
            </div>
            <div class="post-list" id="search-results"></div>
            <div class="empty-state" id="search-empty" hidden>
              <mdui-icon name="search_off--outlined" aria-hidden="true"></mdui-icon>
              <h2>没有找到匹配的文章</h2>
              <p>试试搜索「CSS」「排版」或「JavaScript」。</p>
              <mdui-button variant="tonal" data-action="clear-search">清除搜索</mdui-button>
            </div>
          </div>
        </section>

        <section class="view-panel" id="panel-categories" data-tab="categories" role="tabpanel" aria-labelledby="tab-categories" tabindex="0" hidden>
          <div class="view-meta">
            <span id="categories-meta"></span>
          </div>
          <div class="summary-surface" id="categories-list"></div>
        </section>

        <section class="view-panel" id="panel-tags" data-tab="tags" role="tabpanel" aria-labelledby="tab-tags" tabindex="0" hidden>
          <div class="view-meta">
            <span id="tags-meta"></span>
            <span class="view-meta__hint">点击标签可回到最近发布中筛选</span>
          </div>
          <div class="summary-surface" id="tags-list"></div>
        </section>

        <section class="view-panel" id="panel-archive" data-tab="archive" role="tabpanel" aria-labelledby="tab-archive" tabindex="0" hidden>
          <div class="view-meta">
            <span id="archive-meta"></span>
          </div>
          <div class="summary-surface" id="archive-list"></div>
        </section>
      </div>

      <footer class="page-footer">
        <p>© 2026 小林的小窝</p>
        <p>P0 首页布局演示 · 文章、日期、分类与标签均为演示数据，不代表真实内容。</p>
      </footer>
    </main>
  </div>

  <!-- 移动端侧栏抽屉，内容由与桌面侧栏相同的一份数据渲染 -->
  <mdui-navigation-drawer id="mobile-drawer" modal close-on-esc close-on-overlay-click placement="left" role="dialog" aria-modal="true" aria-label="站点侧栏">
    <div class="drawer-toolbar">
      <mdui-button-icon id="drawer-close" aria-label="关闭侧栏" autofocus>
        <mdui-icon name="close" aria-hidden="true"></mdui-icon>
        <span class="visually-hidden">关闭侧栏</span>
      </mdui-button-icon>
    </div>
    <div class="sidebar-inner drawer-inner" id="sidebar-drawer"></div>
  </mdui-navigation-drawer>

  <!-- 未实现正式文章页时的明确预览占位 -->
  <mdui-dialog id="post-dialog" role="dialog" aria-modal="true" aria-describedby="dialog-excerpt" close-on-esc close-on-overlay-click>
    <div class="dialog-body">
      <div class="dialog-meta" id="dialog-meta"></div>
      <p class="dialog-excerpt" id="dialog-excerpt"></p>
      <div class="dialog-tags" id="dialog-tags"></div>
      <p class="dialog-note">
        <mdui-icon name="info--outlined" aria-hidden="true"></mdui-icon>
        <span>这是 P0 演示预览，完整文章页将在后续版本实现。</span>
      </p>
    </div>
    <mdui-button slot="action" variant="tonal" id="dialog-close" autofocus>关闭</mdui-button>
  </mdui-dialog>

  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/theme.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
