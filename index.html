<!doctype html>
<html lang="zh-CN" class="mdui-theme-auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="小林的小窝，分享前端技术、设计与生活。纯静态博客首页演示。">
  <meta name="color-scheme" content="light dark">
  <title>小林的小窝 · 分享技术、日常</title>
  <link rel="icon" href="data:,">
  <script>
    try {
      var savedTheme = localStorage.getItem('nekomi-theme');
      document.documentElement.className = 'mdui-theme-' +
        (['light', 'dark', 'auto'].includes(savedTheme) ? savedTheme : 'auto');
    } catch (_) { /* 无存储权限时跟随系统。 */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Icons&family=Material+Icons+Outlined&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/mdui@2.1.5/mdui.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/home.css">
  <script src="https://unpkg.com/mdui@2.1.5/mdui.global.js" defer></script>
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/a11y.js" defer></script>
  <script src="assets/js/site.js" defer></script>
  <script src="assets/js/theme.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</head>
<body data-page="home">
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div data-site-appbar></div>
  <div class="site-layout">
    <aside class="sidebar" aria-label="站点信息" data-site-sidebar></aside>

    <main id="main-content" tabindex="-1" aria-busy="true">
      <p id="loading-note" class="loading-note" role="status">正在载入文章…</p>
      <mdui-tabs id="content-tabs" value="recent" variant="secondary" aria-label="博客内容">
        <mdui-tab id="tab-recent" value="recent" role="tab" aria-controls="panel-recent">最近发布</mdui-tab>
        <mdui-tab id="tab-categories" value="categories" role="tab" aria-controls="panel-categories">分类</mdui-tab>
        <mdui-tab id="tab-tags" value="tags" role="tab" aria-controls="panel-tags">标签</mdui-tab>
        <mdui-tab id="tab-archive" value="archive" role="tab" aria-controls="panel-archive">归档</mdui-tab>

        <mdui-tab-panel slot="panel" value="recent" id="panel-recent" role="tabpanel" aria-labelledby="tab-recent" tabindex="0">
          <div class="view-heading">
            <div>
              <p class="eyebrow">技术、灵感，还有日常</p>
              <h1 id="feed-title">最近发布</h1>
              <p id="feed-summary" class="view-description" role="status" aria-live="polite"></p>
            </div>
            <span class="demo-note"><mdui-icon name="science--outlined" aria-hidden="true"></mdui-icon>首页演示</span>
          </div>
          <div id="search-toolbar" class="search-toolbar" hidden>
            <mdui-chip id="search-chip" variant="input" deletable></mdui-chip>
            <mdui-button variant="text" data-clear-search>清除搜索</mdui-button>
          </div>
          <div id="post-list" class="post-list"></div>
          <mdui-card id="search-empty" variant="outlined" class="empty-state" hidden>
            <mdui-icon name="search_off--outlined" aria-hidden="true"></mdui-icon>
            <h2>暂时没有找到</h2>
            <p>换个关键词试试，或者回到全部文章。</p>
            <mdui-button variant="tonal" data-clear-search>查看全部文章</mdui-button>
          </mdui-card>
        </mdui-tab-panel>

        <mdui-tab-panel slot="panel" value="categories" id="panel-categories" role="tabpanel" aria-labelledby="tab-categories" tabindex="0">
          <div class="view-heading"><div><p class="eyebrow">整理与发现</p><h1>文章分类</h1><p class="view-description" id="categories-summary"></p></div></div>
          <div id="categories-list" class="collection-list"></div>
        </mdui-tab-panel>

        <mdui-tab-panel slot="panel" value="tags" id="panel-tags" role="tabpanel" aria-labelledby="tab-tags" tabindex="0">
          <div class="view-heading"><div><p class="eyebrow">循着兴趣阅读</p><h1>所有标签</h1><p class="view-description" id="tags-summary"></p></div></div>
          <mdui-card variant="outlined" class="tag-surface"><div id="tags-list" class="tag-cloud"></div></mdui-card>
        </mdui-tab-panel>

        <mdui-tab-panel slot="panel" value="archive" id="panel-archive" role="tabpanel" aria-labelledby="tab-archive" tabindex="0">
          <div class="view-heading"><div><p class="eyebrow">沿着时间回望</p><h1>文章归档</h1><p class="view-description" id="archive-summary"></p></div></div>
          <div id="archive-list" class="collection-list"></div>
        </mdui-tab-panel>
      </mdui-tabs>
      <footer class="site-footer" data-site-footer></footer>
    </main>
  </div>
  <noscript><p class="loading-note">请启用 JavaScript，以浏览文章和使用搜索。</p></noscript>
</body>
</html>
